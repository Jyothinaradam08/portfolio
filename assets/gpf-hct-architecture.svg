<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="thesisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cnnBranch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="vitBranch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="fusionBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="thesisShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="480" fill="url(#thesisBg)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="900" y2="80" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="0" y1="240" x2="900" y2="240" />
    <line x1="0" y1="320" x2="900" y2="320" />
    <line x1="0" y1="400" x2="900" y2="400" />
    <line x1="180" y1="0" x2="180" y2="480" />
    <line x1="360" y1="0" x2="360" y2="480" />
    <line x1="540" y1="0" x2="540" y2="480" />
    <line x1="720" y1="0" x2="720" y2="480" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(40, 30)">
    <rect width="820" height="48" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
    <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff">GPF-HCT ARCHITECTURE</text>
    <text x="215" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc">Targeted Graph-Preserving Feature Fusion in Hybrid CNN–Transformer</text>
    <rect x="680" y="12" width="124" height="24" rx="12" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1" />
    <text x="742" y="28" font-family="sans-serif" font-size="10" font-weight="700" fill="#bae6fd" text-anchor="middle">NIT RAIPUR THESIS</text>
  </g>

  <!-- Flow Diagrams / Architecture Pipeline -->
  <g transform="translate(40, 100)">
    
    <!-- Stage 1: Input Images -->
    <g transform="translate(0, 30)" filter="url(#thesisShadow)">
      <rect width="130" height="240" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
      <rect width="130" height="34" rx="12" fill="#f1f5f9" />
      <rect y="24" width="130" height="10" fill="#f1f5f9" />
      <text x="65" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#0f172a" text-anchor="middle">MICROSCOPIC INPUT</text>
      
      <!-- Cell Preview Graphics -->
      <g transform="translate(25, 55)">
        <circle cx="40" cy="40" r="32" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
        <circle cx="36" cy="36" r="18" fill="#7dd3fc" opacity="0.6" />
        <circle cx="44" cy="42" r="14" fill="#0284c7" opacity="0.8" />
        <text x="40" y="90" font-family="sans-serif" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">C-NMC 2019</text>
        <text x="40" y="104" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Leukemia Dataset</text>
      </g>

      <g transform="translate(15, 175)">
        <rect width="100" height="42" rx="6" fill="#f0f9ff" stroke="#bae6fd" />
        <text x="50" y="18" font-family="sans-serif" font-size="9" font-weight="700" fill="#0369a1" text-anchor="middle">Blood-Cell Patches</text>
        <text x="50" y="32" font-family="sans-serif" font-size="8" fill="#0284c7" text-anchor="middle">RGB Normalized</text>
      </g>
    </g>

    <!-- Arrow 1 to 2 -->
    <path d="M 135 150 L 175 105 M 135 150 L 175 195" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)" />

    <!-- Stage 2: Dual Branch Feature Extraction -->
    <!-- Branch A: CNN (Morphology) -->
    <g transform="translate(180, 15)" filter="url(#thesisShadow)">
      <rect width="190" height="110" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" />
      <rect width="190" height="28" rx="10" fill="#e0f2fe" />
      <rect y="20" width="190" height="8" fill="#e0f2fe" />
      <text x="12" y="18" font-family="sans-serif" font-size="10" font-weight="800" fill="#0369a1">CNN BRANCH</text>
      <text x="178" y="18" font-family="sans-serif" font-size="9" font-weight="600" fill="#0284c7" text-anchor="end">Local Features</text>
      
      <g transform="translate(12, 38)">
        <text x="0" y="14" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">Morphological Extraction</text>
        <text x="0" y="28" font-family="sans-serif" font-size="9" fill="#64748b">• Cellular contour &amp; boundary</text>
        <text x="0" y="42" font-family="sans-serif" font-size="9" fill="#64748b">• Fine cytoplasmic texture</text>
        <text x="0" y="56" font-family="sans-serif" font-size="9" font-weight="600" fill="#0284c7">• Multiscale receptive fields</text>
      </g>
    </g>

    <!-- Branch B: Vision Transformer (Global Semantics) -->
    <g transform="translate(180, 175)" filter="url(#thesisShadow)">
      <rect width="190" height="110" rx="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5" />
      <rect width="190" height="28" rx="10" fill="#ede9fe" />
      <rect y="20" width="190" height="8" fill="#ede9fe" />
      <text x="12" y="18" font-family="sans-serif" font-size="10" font-weight="800" fill="#6d28d9">TRANSFORMER BRANCH</text>
      <text x="178" y="18" font-family="sans-serif" font-size="9" font-weight="600" fill="#7c3aed" text-anchor="end">Global Context</text>

      <g transform="translate(12, 38)">
        <text x="0" y="14" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">Self-Attention Mechanism</text>
        <text x="0" y="28" font-family="sans-serif" font-size="9" fill="#64748b">• Long-range spatial dependency</text>
        <text x="0" y="42" font-family="sans-serif" font-size="9" fill="#64748b">• Global semantic representation</text>
        <text x="0" y="56" font-family="sans-serif" font-size="9" font-weight="600" fill="#7c3aed">• Multi-head token interactions</text>
      </g>
    </g>

    <!-- Arrows from Dual Branch to Graph Fusion -->
    <path d="M 375 70 L 415 130 M 375 230 L 415 170" stroke="#38bdf8" stroke-width="2" fill="none" />

    <!-- Stage 3: Graph-Preserving Feature Fusion (GPF) -->
    <g transform="translate(420, 30)" filter="url(#thesisShadow)">
      <rect width="190" height="240" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" />
      <rect width="190" height="34" rx="12" fill="#f0fdf4" />
      <rect y="24" width="190" height="10" fill="#f0fdf4" />
      <text x="95" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#166534" text-anchor="middle">GPF FUSION MODULE</text>
      
      <!-- Graph Nodes Graphic -->
      <g transform="translate(35, 50)">
        <circle cx="20" cy="20" r="10" fill="#0284c7" />
        <circle cx="100" cy="20" r="10" fill="#7c3aed" />
        <circle cx="60" cy="65" r="12" fill="#10b981" />
        <line x1="20" y1="20" x2="100" y2="20" stroke="#94a3b8" stroke-width="2" />
        <line x1="20" y1="20" x2="60" y2="65" stroke="#0284c7" stroke-width="2" />
        <line x1="100" y1="20" x2="60" y2="65" stroke="#7c3aed" stroke-width="2" />
        <text x="60" y="98" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Topological Feature Graph</text>
      </g>

      <g transform="translate(12, 160)">
        <rect width="166" height="64" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="8" y="16" font-family="sans-serif" font-size="9" font-weight="700" fill="#166534">• Graph Topology Preservation</text>
        <text x="8" y="32" font-family="sans-serif" font-size="8" fill="#475569">• Controlled Ablation Benchmarking</text>
        <text x="8" y="48" font-family="sans-serif" font-size="8" fill="#475569">• Multi-Seed Ensemble Learning</text>
      </g>
    </g>

    <!-- Arrow to Output -->
    <path d="M 615 150 L 655 150" stroke="#38bdf8" stroke-width="2" fill="none" />

    <!-- Stage 4: Classification & Decision Calibration -->
    <g transform="translate(660, 30)" filter="url(#thesisShadow)">
      <rect width="160" height="240" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
      <rect width="160" height="34" rx="12" fill="#f1f5f9" />
      <rect y="24" width="160" height="10" fill="#f1f5f9" />
      <text x="80" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#0f172a" text-anchor="middle">CALIBRATED VERDICT</text>
      
      <g transform="translate(15, 52)">
        <!-- ALL Class 1 -->
        <rect width="130" height="42" rx="8" fill="#eff6ff" stroke="#bfdbfe" />
        <circle cx="22" cy="21" r="7" fill="#0284c7" />
        <text x="36" y="18" font-family="sans-serif" font-size="10" font-weight="800" fill="#1e3a8a">Leukemic Blast</text>
        <text x="36" y="30" font-family="sans-serif" font-size="8" fill="#0369a1">ALL Malignant Cell</text>

        <!-- Normal Class 2 -->
        <g transform="translate(0, 52)">
          <rect width="130" height="42" rx="8" fill="#f0fdf4" stroke="#bbf7d0" />
          <circle cx="22" cy="21" r="7" fill="#16a34a" />
          <text x="36" y="18" font-family="sans-serif" font-size="10" font-weight="800" fill="#14532d">Normal Cell</text>
          <text x="36" y="30" font-family="sans-serif" font-size="8" fill="#15803d">Non-Leukemic Hemocyte</text>
        </g>
      </g>

      <g transform="translate(15, 160)">
        <rect width="130" height="64" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="8" y="16" font-family="sans-serif" font-size="8" font-weight="700" fill="#334155">Threshold Calibration:</text>
        <text x="8" y="30" font-family="sans-serif" font-size="8" fill="#64748b">Validation-calibrated</text>
        <text x="8" y="44" font-family="sans-serif" font-size="8" fill="#64748b">decision boundaries</text>
        <text x="8" y="56" font-family="sans-serif" font-size="8" font-weight="600" fill="#0284c7">for clinical safety</text>
      </g>
    </g>

  </g>

  <!-- Bottom Academic Citation Footer -->
  <g transform="translate(40, 420)">
    <rect width="820" height="38" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="20" y="24" font-family="sans-serif" font-size="11" fill="#94a3b8">
      <tspan font-weight="700" fill="#e2e8f0">Manuscript Status:</tspan> Prepared for submission to International Journal of Information Technology (Springer) • M.Tech Ongoing Thesis (NIT Raipur)
    </text>
  </g>
</svg>
