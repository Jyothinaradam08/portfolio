<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Professional Sky Blue Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Soft Sky Aura Glow -->
    <radialGradient id="skyAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#bae6fd" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Clean Medallion Fill -->
    <radialGradient id="cardGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </radialGradient>
  </defs>

  <!-- Clean Professional Background -->
  <rect width="400" height="400" rx="36" fill="#f8fafc" />
  <rect width="396" height="396" x="2" y="2" rx="34" fill="none" stroke="#e2e8f0" stroke-width="1.5" />
  
  <circle cx="200" cy="180" r="160" fill="url(#skyAura)" />

  <!-- Geometric Rings in Sky Blue -->
  <circle cx="200" cy="175" r="130" fill="none" stroke="url(#skyGrad)" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.4" />
  <circle cx="200" cy="175" r="148" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="1,12" opacity="0.3" />

  <!-- Inner Badge Medallion -->
  <circle cx="200" cy="170" r="88" fill="url(#skyGrad)" opacity="0.95" />
  <circle cx="200" cy="170" r="84" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="2" />

  <!-- Monogram & Tech Constellation -->
  <g transform="translate(145, 115)">
    <!-- Node Network Lines -->
    <path d="M 55,20 L 22,65 L 88,65 Z" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.5" />
    <circle cx="55" cy="20" r="4.5" fill="#0284c7" />
    <circle cx="22" cy="65" r="4.5" fill="#0ea5e9" />
    <circle cx="88" cy="65" r="4.5" fill="#38bdf8" />
    
    <!-- Monogram Typography -->
    <text x="55" y="85" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="28" fill="#0369a1" text-anchor="middle" letter-spacing="4">JLN</text>
  </g>

  <!-- Lower Prestige Ribbon -->
  <rect x="70" y="295" width="260" height="42" rx="21" fill="#ffffff" stroke="url(#skyGrad)" stroke-width="1.5" />
  <text x="200" y="321" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#0284c7" text-anchor="middle" letter-spacing="2">NIT RAIPUR • AI &amp; ML SCHOLAR</text>

  <!-- Sky Blue Sparkle Accents -->
  <polygon points="325,75 328,84 337,87 328,90 325,99 322,90 313,87 322,84" fill="#0ea5e9" opacity="0.6" />
  <polygon points="75,235 77,241 83,243 77,245 75,251 73,245 67,243 73,241" fill="#38bdf8" opacity="0.6" />
</svg>
