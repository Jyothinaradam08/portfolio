<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Classy Metallic Champagne Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2cc" />
      <stop offset="35%" stop-color="#e8c66e" />
      <stop offset="70%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa821c" />
    </linearGradient>

    <!-- Warm Obsidian Halo Glow -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#b38753" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0a0b0e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cardGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#232630" />
      <stop offset="100%" stop-color="#0e1014" />
    </radialGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="400" height="400" rx="36" fill="#0a0b0e" />
  <rect width="396" height="396" x="2" y="2" rx="34" fill="none" stroke="rgba(212, 175, 55, 0.2)" stroke-width="1.5" />
  
  <circle cx="200" cy="180" r="160" fill="url(#auraGlow)" />

  <!-- Sophisticated Geometric Rings -->
  <circle cx="200" cy="175" r="130" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="4,6" opacity="0.4" />
  <circle cx="200" cy="175" r="148" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="1,12" opacity="0.5" />

  <!-- Inner Badge Medallion -->
  <circle cx="200" cy="170" r="88" fill="url(#goldGrad)" filter="url(#goldGlow)" opacity="0.9" />
  <circle cx="200" cy="170" r="84" fill="url(#cardGlow)" stroke="rgba(255, 242, 204, 0.3)" stroke-width="1.5" />

  <!-- Monogram & Tech Constellation -->
  <g transform="translate(145, 115)">
    <!-- Node Network Lines -->
    <path d="M 55,20 L 22,65 L 88,65 Z" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.6" />
    <circle cx="55" cy="20" r="4.5" fill="#fff2cc" />
    <circle cx="22" cy="65" r="4.5" fill="#d4af37" />
    <circle cx="88" cy="65" r="4.5" fill="#e8c66e" />
    
    <!-- Monogram Typography -->
    <text x="55" y="85" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="28" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">JLN</text>
  </g>

  <!-- Lower Prestige Ribbon -->
  <rect x="70" y="295" width="260" height="42" rx="21" fill="#13161c" stroke="url(#goldGrad)" stroke-width="1.2" />
  <text x="200" y="321" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#e8c66e" text-anchor="middle" letter-spacing="2">NIT RAIPUR • AI &amp; ML SCHOLAR</text>

  <!-- Subtle Gold Star Accents -->
  <polygon points="325,75 328,84 337,87 328,90 325,99 322,90 313,87 322,84" fill="#d4af37" opacity="0.75" />
  <polygon points="75,235 77,241 83,243 77,245 75,251 73,245 67,243 73,241" fill="#e8c66e" opacity="0.6" />
</svg>
